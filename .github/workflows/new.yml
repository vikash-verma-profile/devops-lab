name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: devops-lab
  KUBE_NAMESPACE: default
  DOCKERFILE_PATH: ./Dockerfile
  K8S_MANIFEST_PATH: ./kubernetes/k8s-deployment.yaml

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test

  build-push-deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      # Login to Docker Hub (or your container registry)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      # Setup kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      
      # Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl config set-cluster k8s \
            --server=${{ secrets.K8S_CLUSTER_URL }} \
            --insecure-skip-tls-verify=true
          kubectl config set-credentials k8s \
            --token=${{ secrets.K8S_CLUSTER_TOKEN }}
          kubectl config set-context k8s \
            --cluster=k8s \
            --user=k8s \
            --namespace=${{ env.KUBE_NAMESPACE }}
          kubectl config use-context k8s
          
          # Update image in deployment manifest
          sed -i "s|image:.*|image: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" ${{ env.K8S_MANIFEST_PATH }}
          
          kubectl apply -f ${{ env.K8S_MANIFEST_PATH }}